services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_backend
    restart: always
    environment:
      PORT: ${BACKEND_PORT:-8080}
      MONGO_URI: ${MONGO_URI:-mongodb://admin:ChangeMeStrongPassword@mongodb:27017/course_ecommerce_db?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@course.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads

volumes:
  uploads_data: